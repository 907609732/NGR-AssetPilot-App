name: Desktop Production Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v3.*"

permissions:
  contents: read

jobs:
  build-release:
    runs-on: windows-latest
    environment: production-release
    permissions:
      contents: write
    timeout-minutes: 60
    env:
      npm_config_cache: ${{ github.workspace }}\.cache\npm
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\.cache\ms-playwright
      TEMP: ${{ github.workspace }}\.tmp
      TMP: ${{ github.workspace }}\.tmp
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version"
          }
      - name: Prepare project-local directories
        shell: pwsh
        run: New-Item -ItemType Directory -Force .cache/npm,.cache/electron,.cache/electron-builder,.cache/ms-playwright,.tmp,logs | Out-Null
      - name: Install exact dependencies
        run: npm ci
      - name: Test and build unsigned production release
        run: |
          npm test
          npm run build
          npm run verify:packaged:prod
      - name: Upload production build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NGR-AssetPilot-Production-Windows-x64
          path: |
            artifacts/prod/*.exe
            artifacts/prod/*.blockmap
            artifacts/prod/latest.yml
            artifacts/prod/*-SHA256SUMS.txt
            artifacts/prod/*-sbom.cdx.json
            artifacts/prod/*-build-manifest.json
          if-no-files-found: error
      - name: Publish GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: false
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            artifacts/prod/*.exe
            artifacts/prod/*.blockmap
            artifacts/prod/latest.yml
            artifacts/prod/*-SHA256SUMS.txt
            artifacts/prod/*-sbom.cdx.json
            artifacts/prod/*-build-manifest.json
