name: Desktop Production Release

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      host_commit:
        type: string
        required: true
  push:
    tags:
      - "v3.*"

permissions:
  contents: read

jobs:
  build-release:
    if: github.repository == '907609732/NGR-AssetPilot-App' || github.repository == '907609732/lingtu-interface-finder'
    runs-on: windows-latest
    environment: production-release
    permissions:
      contents: write
    timeout-minutes: 60
    env:
      npm_config_cache: ${{ github.workspace }}\.cache\npm
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\.cache\ms-playwright
      TEMP: ${{ github.workspace }}\.tmp
      TMP: ${{ github.workspace }}\.tmp
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      NGR_BAIDU_CFC_ENDPOINT: ${{ vars.NGR_BAIDU_CFC_ENDPOINT }}
    steps:
      - name: Validate private build input
        if: github.repository == '907609732/lingtu-interface-finder'
        env:
          HOST_COMMIT: ${{ inputs.host_commit }}
        shell: pwsh
        run: |
          if ($env:HOST_COMMIT -cnotmatch '^[a-f0-9]{40}$') {
            throw 'A full AssetPilot main commit is required'
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 907609732/NGR-AssetPilot-App
          ref: ${{ inputs.host_commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version"
          }
      - name: Prepare project-local directories
        shell: pwsh
        run: New-Item -ItemType Directory -Force .cache/npm,.cache/electron,.cache/electron-builder,.cache/ms-playwright,.tmp,logs | Out-Null
      - name: Install exact dependencies
        run: npm ci
      - name: Verify managed cloud translation
        run: npm run verify:managed-provider
      - name: Prepare managed provider for renderer tests
        run: npm run prepare:managed-provider -- --required
      - name: Test production release
        run: npm test
      - name: Read the Finder component lock
        id: finder
        shell: pwsh
        run: |
          $component = Get-Content -LiteralPath 'build/finder-builtin.lock.json' -Raw | ConvertFrom-Json
          if ($component.repository -cne '907609732/lingtu-interface-finder' -or $component.artifactCommit -cnotmatch '^[a-f0-9]{40}$') {
            throw 'Invalid pinned Finder artifact'
          }
          "artifact_commit=$($component.artifactCommit)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Check out the pinned private Finder artifact
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 907609732/lingtu-interface-finder
          ref: ${{ steps.finder.outputs.artifact_commit }}
          path: .tmp/finder-component
          ssh-key: ${{ github.repository == '907609732/NGR-AssetPilot-App' && secrets.NGR_FINDER_READ_KEY || '' }}
          persist-credentials: false
      - name: Verify and stage the pinned Finder component
        run: node scripts/prepare-builtin-finder-ci.mjs .tmp/finder-component
      - name: Build production release
        run: npm run build
      - name: Verify packaged production release
        run: npm run verify:packaged:prod
      - name: Upload production build artifacts
        if: github.repository == '907609732/lingtu-interface-finder' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NGR-AssetPilot-Production-Windows-x64
          path: |
            artifacts/prod/*.exe
            artifacts/prod/*.blockmap
            artifacts/prod/latest.yml
            artifacts/prod/*-SHA256SUMS.txt
            artifacts/prod/*-sbom.cdx.json
            artifacts/prod/*-build-manifest.json
            artifacts/prod/extension-report.json
            artifacts/prod/extension-release-notes.md
          if-no-files-found: error
      - name: Append extension versions to release notes
        shell: pwsh
        run: |
          $releaseVersion = node -p "require('./package.json').version"
          $releaseNotes = Get-Content -LiteralPath "docs/releases/v$releaseVersion.md" -Raw
          $extensionNotes = Get-Content -LiteralPath 'artifacts/prod/extension-release-notes.md' -Raw
          "$releaseNotes`n`n$extensionNotes" | Set-Content -LiteralPath '.tmp/production-release-notes.md' -Encoding utf8
          $extensionNotes | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Publish GitHub Release for tag
        if: github.repository == '907609732/NGR-AssetPilot-App' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: false
          body_path: .tmp/production-release-notes.md
          files: |
            artifacts/prod/*.exe
            artifacts/prod/*.blockmap
            artifacts/prod/latest.yml
            artifacts/prod/*-SHA256SUMS.txt
            artifacts/prod/*-sbom.cdx.json
            artifacts/prod/*-build-manifest.json
            artifacts/prod/extension-report.json
            artifacts/prod/extension-release-notes.md
